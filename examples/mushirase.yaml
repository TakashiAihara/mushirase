# Paths are relative to this file.
inventory:
  - stack.yaml
  # - ../../my-repo          # a checkout: manifests are scanned (package.json, composer.json, go.mod, ...)

maxAgeDays: 7

feeds:
  # Project feeds: every item is about the product, so only security relevance is checked.
  - { name: php, url: "https://www.php.net/feed.atom", product: php }
  - { name: nextjs, url: "https://nextjs.org/feed.xml", product: next }
  - { name: nodejs, url: "https://nodejs.org/en/feed/vulnerability.xml", product: node }
  - { name: drupal-psa, url: "https://www.drupal.org/security/psa/rss.xml", product: drupal/core }
  - { name: django, url: "https://www.djangoproject.com/rss/weblog/", product: django }
  # General feeds: items must name an asset.
  - { name: oss-security, url: "https://seclists.org/rss/oss-sec.rss" }
  - { name: aws-bulletins, url: "https://aws.amazon.com/security/security-bulletins/rss/feed/" }
  - { name: socket, url: "https://socket.dev/api/blog/feed.atom" }

# Optional second opinion on each keyword hit (any OpenAI-compatible endpoint).
# llm: { url: "http://localhost:11434/v1", model: "qwen3.5:9b", reasoningEffort: none }

# ntfy: { url: "https://ntfy.sh", topic: "my-mushirase", tokenEnv: MUSHIRASE_NTFY_TOKEN }

rss: { path: "../.mushirase/feed.atom", title: "mushirase" }
state: ../.mushirase/state.json
